        <h2>Eiginleikar</h2>
        <ul>
          <li><strong>Bókunardagatal</strong> — Sjáðu strax hver er búinn að panta helgar. Einfalt og skýrt dagatal þar sem allir sjá.</li>
          <li><strong>Sanngirnisregla</strong> — Innbyggð sanngirnisregla tryggir að allir fái sinn tíma og að enginn sitji einn að vinsælustu helgunum.</li>
          <li><strong>Hússjóður</strong> — Gagnsæ fjármál. Kerfið heldur sjálfkrafa utan um hússjóð og gerir allt skýrt og sanngjarnt.</li>
          <li><strong>Tilkynningar</strong> — Fáðu boð í tölvupósti þegar ný bókun dettur inn.</li>
          <li><strong>Verkefnastjórnun</strong> — Skipuleggðu viðhald og verkefni fyrir sumarhúsið.</li>
          <li><strong>Torgið</strong> — Finndu verktaka og þjónustuaðila í nágrenninu við bústaðinn þinn.</li>
        </ul>
        <h2>Verð</h2>
        <p>Ókeypis — enginn falinn kostnaður, engin áskrift, engin binding. Ótakmarkaður fjöldi notenda.</p>
