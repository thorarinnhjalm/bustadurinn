        if (started) return;

      function arm() {
        if (armed) return;
        armed = true;
        if ('requestIdleCallback' in window) requestIdleCallback(start, { timeout: 3500 });
        else setTimeout(start, 3500);
      }
      window.__whenPageUsable = function (fn) { if (started) fn(); else queue.push(fn); };
      ['pointerdown', 'keydown', 'scroll'].forEach(function (t) {

  <script>

        umsogninScript.src = 'https://umsognin.is/widget.js';
        umsogninScript.defer = true;
        // Prerendering runs at desktop width, so this branch executes and the
        // tag would otherwise be serialised into the static HTML — handing the
        // widget to phones anyway. scripts/prerender.js strips anything marked

        umsogninScript.dataset.runtimeInjected = 'true';
        document.head.appendChild(umsogninScript);
